<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VToConnect-Web</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../components/navbar/navbar.css">
    <link rel="stylesheet" href="../../styles/explorar.css">
    <link rel="stylesheet" href="../../styles/filtros.css">
    <style>
        #map-container {
            position: relative;
            z-index: 1;
            overflow: hidden;
        }
        .top-search-bar {
            z-index: 1000;
        }
        .bottom-sheet {
            z-index: 1000;
        }
        .bottom-sheet-overlay {
            z-index: 2000;
        }
        .bottom-nav {
            z-index: 1500;
        }
        .leaflet-popup-content-wrapper {
            border-radius: 14px !important;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.14) !important;
            padding: 4px;
        }
        .leaflet-popup-tip {
            background: #ffffff !important;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="top-search-bar">
            <div class="search-input-container">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Buscar eventos, clases...">
            </div>
            <button class="filter-btn" id="openFiltersBtn">
                <i class="fa-solid fa-sliders"></i>
            </button>
        </div>

        <div id="map-container" class="map-placeholder"></div>

        <div class="bottom-sheet">
            <div class="drag-handle-container">
                <div class="drag-handle"></div>
            </div>

            <div class="sheet-content">
                <div class="categories-scroll" id="categoriesScroll">
                    <div class="category-chip active" data-cat="todos">Todos</div>
                    <div class="category-chip" data-cat="yoga">Yoga</div>
                    <div class="category-chip" data-cat="baile">Baile</div>
                    <div class="category-chip" data-cat="senderismo">Senderismo</div>
                    <div class="category-chip" data-cat="tours">Tours</div>
                    <div class="category-chip" data-cat="deportes">Deportes</div>
                </div>

                <div class="section-header">
                    <h2 class="section-title">Cerca de ti este fin de semana</h2>
                </div>

                <div class="events-scroll" id="eventsScrollContainer">
                    <p style="padding: 16px; color: #777;">Cargando eventos...</p>
                </div>
            </div>
        </div>

        <div class="bottom-sheet-overlay" id="filterOverlay">
            <div class="filter-bottom-sheet" id="filterSheet">
                
                <div class="filter-sheet-header">
                    <h2>Filtros de búsqueda</h2>
                    <button class="close-btn" id="closeFiltersBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>

                <div class="filter-section">
                    <div class="filter-section-header">
                        <h3>Cercanía (Distancia)</h3>
                        <button class="reset-btn" id="resetDistanceBtn">Restablecer</button>
                    </div>
                    <div class="slider-container">
                        <div class="slider-value-display" id="distanceDisplay">5 km</div>
                        <input type="range" min="1" max="16" value="5" class="custom-slider" id="distanceSlider">
                        <div class="slider-labels">
                            <span>1 km</span>
                            <span>15+ km</span>
                        </div>
                    </div>
                </div>

                <div class="filter-section">
                    <h3>Número de personas</h3>
                    <div class="pill-group" id="peopleGroup">
                        <button class="pill-btn active" data-value="individual">Individual</button>
                        <button class="pill-btn" data-value="2-5">2-5 personas</button>
                        <button class="pill-btn" data-value="6-10">6-10 personas</button>
                        <button class="pill-btn" data-value="10+">Grupos grandes (10+)</button>
                    </div>
                </div>

                <div class="filter-section">
                    <h3>Fecha y hora</h3>
                    <div class="pill-group" id="dateGroup">
                        <button class="pill-btn" data-value="hoy">Hoy</button>
                        <button class="pill-btn" data-value="fin-semana">Este fin de semana</button>
                        <button class="pill-btn" data-value="proxima-semana">Próxima semana</button>
                    </div>
                </div>

                <div class="filter-section">
                    <h3>Precio</h3>
                    <div class="pill-group" id="priceGroup">
                        <button class="pill-btn active" data-value="gratis">Gratis</button>
                        <button class="pill-btn" data-value="bajo">$ (Bajo)</button>
                        <button class="pill-btn" data-value="medio">$$ (Medio)</button>
                        <button class="pill-btn" data-value="alto">$$$ (Alto)</button>
                    </div>
                </div>

                <div class="filter-section">
                    <h3>Categoría de actividad</h3>
                    <div class="pill-group" id="categoryGroup">
                        <button class="pill-btn" data-value="yoga">Yoga</button>
                        <button class="pill-btn" data-value="baile">Baile</button>
                        <button class="pill-btn" data-value="deportes">Deportes</button>
                        <button class="pill-btn" data-value="senderismo">Senderismo</button>
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="apply-btn" id="applyFiltersBtn">Aplicar filtros</button>
                    <button class="show-results-btn" id="showResultsBtn">Mostrar resultados</button>
                </div>
                
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="../explorar/menuExplorar.html" class="nav-item active">
                <i class="fa-regular fa-compass"></i>
                <span>Explorar</span>
            </a>
            <a href="../mis-eventos/misEventos.html" class="nav-item">
                <i class="fa-regular fa-calendar-check"></i>
                <span>Mis Eventos</span>
            </a>
            <a href="../crear-evento/crearEvento.html" class="nav-item">
                <i class="fa-solid fa-circle-plus"></i>
                <span>Crear</span>
            </a>
            <a href="../chat/menuChat.html" class="nav-item">
                <i class="fa-regular fa-comment-dots"></i>
                <span>Mensajes</span>
            </a>
            <a href="../perfil/menuPerfil.html" class="nav-item">
                <i class="fa-regular fa-user"></i>
                <span>Perfil</span>
            </a>
        </nav>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../../supabase/api.js"></script>

    <script>
        const mapa = L.map('map-container', { zoomControl: false }).setView([20.6950, -103.3550], 11);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: '&copy; Esri &mdash; OpenStreetMap'
        }).addTo(mapa);

        const capaPines = L.layerGroup().addTo(mapa);

        const iconoEventoVTo = L.divIcon({
            className: 'custom-vto-pin',
            html: `
                <div style="
                    background: #D95D39;
                    width: 34px;
                    height: 34px;
                    border-radius: 50% 50% 50% 0;
                    transform: rotate(-45deg);
                    border: 3px solid #FFFFFF;
                    box-shadow: 0 4px 12px rgba(217, 93, 57, 0.45);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                ">
                    <i class="fa-solid fa-location-dot" style="color: #fff; font-size: 14px; transform: rotate(45deg);"></i>
                </div>
            `,
            iconSize: [34, 34],
            iconAnchor: [17, 34],
            popupAnchor: [0, -34]
        });

        const coordsRespaldoGDL = [
            [20.6716, -103.4408],
            [20.6975, -103.3936],
            [20.6736, -103.3688],
            [20.6767, -103.3475],
            [20.7204, -103.3918]
        ];

        function obtenerCoordenadasEvento(ev, index) {
            if (ev.latitude && ev.longitude) {
                return [Number(ev.latitude), Number(ev.longitude)];
            }
            const texto = `${ev.title || ''} ${ev.location_name || ''}`.toLowerCase();
            if (texto.includes('barranca') || texto.includes('huentit') || texto.includes('tetl')) {
                return [20.7356, -103.3075];
            }
            if (texto.includes('metropolitano')) {
                return [20.6716, -103.4408];
            }
            if (texto.includes('colomos')) {
                return [20.6975, -103.3936];
            }
            return coordsRespaldoGDL[index % coordsRespaldoGDL.length];
        }

        function actualizarPinesMapa(eventos) {
            capaPines.clearLayers();
            const bounds = [];

            eventos.forEach((ev, index) => {
                const [lat, lng] = obtenerCoordenadasEvento(ev, index);
                bounds.push([lat, lng]);

                const marker = L.marker([lat, lng], { icon: iconoEventoVTo }).addTo(capaPines);
                marker.bindPopup(`
                    <div style="font-family: Inter, sans-serif; min-width: 140px;">
                        <strong style="color: #222; font-size: 13px;">${ev.title}</strong><br>
                        <span style="color: #666; font-size: 11px;">${ev.location_name || 'Guadalajara'}</span><br>
                        <a href="../filtros/detalleEventos.html?id=${ev.id}" style="display:inline-block; margin-top:6px; color:#D95D39; font-weight:600; font-size:12px; text-decoration:none;">Ver evento →</a>
                    </div>
                `);
            });

            if (bounds.length > 0) {
                mapa.fitBounds(bounds, { padding: [45, 45], maxZoom: 13 });
            }
        }

        const openBtn = document.getElementById('openFiltersBtn');
        const closeBtn = document.getElementById('closeFiltersBtn');
        const overlay = document.getElementById('filterOverlay');
        const sheet = document.getElementById('filterSheet');
        const applyBtn = document.getElementById('applyFiltersBtn');
        const showResultsBtn = document.getElementById('showResultsBtn');
        const searchInput = document.getElementById('searchInput');
        const slider = document.getElementById('distanceSlider');
        const distanceDisplay = document.getElementById('distanceDisplay');
        const resetBtn = document.getElementById('resetDistanceBtn');
        const allPills = document.querySelectorAll('.pill-btn');

        function openSheet() {
            overlay.classList.add('active');
            setTimeout(() => sheet.classList.add('active'), 10);
        }

        function closeSheet() {
            sheet.classList.remove('active');
            setTimeout(() => overlay.classList.remove('active'), 300);
        }

        if (openBtn) openBtn.addEventListener('click', openSheet);
        if (closeBtn) closeBtn.addEventListener('click', closeSheet);
        if (overlay) {
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) closeSheet();
            });
        }

        function updateSliderDisplay() {
            if (!slider) return;
            const val = slider.value;
            distanceDisplay.textContent = val > 15 ? '15+ km' : val + ' km';
            const percent = (val - slider.min) / (slider.max - slider.min);
            const thumbWidth = 24;
            const sliderWidth = slider.offsetWidth;
            const offset = percent * (sliderWidth - thumbWidth) + (thumbWidth / 2);
            slider.style.setProperty('--value', `${percent * 100}%`);
            distanceDisplay.style.left = `${offset}px`;
        }

        if (slider) {
            slider.addEventListener('input', updateSliderDisplay);
            window.addEventListener('resize', updateSliderDisplay);
            setTimeout(updateSliderDisplay, 100);
        }

        allPills.forEach(pill => {
            pill.addEventListener('click', function () {
                this.classList.toggle('active');
            });
        });

        if (resetBtn) {
            resetBtn.addEventListener('click', () => {
                slider.value = 5;
                updateSliderDisplay();
            });
        }

        let todosLosEventos = [];
        let categoriaSeleccionada = 'todos';

        function formatearFechaEvento(fechaIso) {
            if (!fechaIso) return 'Fecha por confirmar';
            const fecha = new Date(fechaIso);
            return fecha.toLocaleDateString('es-MX', {
                weekday: 'short',
                day: 'numeric',
                month: 'short',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function renderizarEventos(lista) {
            const container = document.getElementById('eventsScrollContainer');
            actualizarPinesMapa(lista);

            if (!lista || lista.length === 0) {
                container.innerHTML = `<p style="padding: 16px; color: #777;">No se encontraron eventos con esos filtros.</p>`;
                return;
            }

            container.innerHTML = lista.map(ev => {
                const organizador = ev.users?.full_name || 'Organizador';
                const asistentes = ev.event_attendees || [];
                const totalAsistentes = asistentes.length;

                const avataresHtml = asistentes.slice(0, 3).map(a => {
                    const url = a.users?.avatar_url;
                    return url
                        ? `<img src="${url}" alt="Asistente" style="width:24px; height:24px; border-radius:50%; object-fit:cover; border:2px solid #fff; margin-left:-6px;">`
                        : `<div class="avatar-placeholder"></div>`;
                }).join('');

                return `
                    <div class="event-card">
                        ${ev.cover_image_url
                            ? `<img src="${ev.cover_image_url}" alt="${ev.title}" style="width:100%; height:130px; object-fit:cover; border-radius:14px 14px 0 0;">`
                            : `<div class="card-img-placeholder">[Sin imagen]</div>`
                        }
                        <div class="card-content">
                            <h3 class="card-title">${ev.title}</h3>
                            <p class="card-author">Por ${organizador}</p>
                            
                            <div class="card-details-row">
                                <i class="fa-regular fa-calendar"></i>
                                <span>${formatearFechaEvento(ev.starts_at)}</span>
                            </div>
                            <div class="card-details-row">
                                <i class="fa-solid fa-location-dot"></i>
                                <span>${ev.location_name || 'Guadalajara'}</span>
                            </div>

                            <div class="card-footer">
                                <div class="attendees">
                                    <div class="avatar-group">
                                        ${avataresHtml || '<div class="avatar-placeholder"></div>'}
                                    </div>
                                    <span class="attendees-count">+${totalAsistentes} asistirán</span>
                                </div>
                                <button class="btn-details" onclick="window.location.href='../filtros/detalleEventos.html?id=${ev.id}'">
                                    Ver detalles
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filtrarYMostrar() {
            const textoBusqueda = (searchInput?.value || '').trim().toLowerCase();
            const categoriasModal = Array.from(document.querySelectorAll('#categoryGroup .pill-btn.active'))
                .map(btn => btn.dataset.value.toLowerCase());

            const filtrados = todosLosEventos.filter(ev => {
                const coincideChip = categoriaSeleccionada === 'todos' ||
                    (ev.category && ev.category.toLowerCase().includes(categoriaSeleccionada));

                const coincideModalCat = categoriasModal.length === 0 ||
                    (ev.category && categoriasModal.includes(ev.category.toLowerCase()));

                const coincideTexto = !textoBusqueda ||
                    (ev.title && ev.title.toLowerCase().includes(textoBusqueda)) ||
                    (ev.location_name && ev.location_name.toLowerCase().includes(textoBusqueda)) ||
                    (ev.category && ev.category.toLowerCase().includes(textoBusqueda));

                return coincideChip && coincideModalCat && coincideTexto;
            });

            renderizarEventos(filtrados);
        }

        document.querySelectorAll('#categoriesScroll .category-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                document.querySelectorAll('#categoriesScroll .category-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                categoriaSeleccionada = chip.dataset.cat;
                filtrarYMostrar();
            });
        });

        if (searchInput) {
            searchInput.addEventListener('input', filtrarYMostrar);
        }

        if (applyBtn) {
            applyBtn.addEventListener('click', () => {
                filtrarYMostrar();
                closeSheet();
            });
        }

        if (showResultsBtn) {
            showResultsBtn.addEventListener('click', () => {
                filtrarYMostrar();
                closeSheet();
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                todosLosEventos = await obtenerEventosExplorarAPI();
                renderizarEventos(todosLosEventos);
                setTimeout(() => mapa.invalidateSize(), 200);
            } catch (error) {
                console.error('Error al cargar eventos:', error);
                document.getElementById('eventsScrollContainer').innerHTML =
                    `<p style="padding: 16px; color: #d9534f;">Error al cargar los eventos desde Supabase.</p>`;
            }
        });
    </script>
</body>
</html>
