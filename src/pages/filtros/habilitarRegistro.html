<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Evento</title>
    <!-- FontAwesome para los íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="detalle-evento.css">
</head>
<body>

<div class="mobile-container">
    <!-- Botón circular de regreso -->
    <a href="#" class="back-button">
        <i class="fa-solid fa-chevron-left"></i>
    </a>

    <!-- Placeholder Imagen Superior -->
    <div class="hero-image-placeholder">
        [Imagen Principal del Evento]
    </div>

    <div class="content">
        <!-- Título -->
        <h1 class="title">Clase de Yoga al Aire Libre y Convivencia</h1>
        
        <!-- Detalles del Evento -->
        <div class="details-list">
            <div class="detail-item">
                <i class="fa-regular fa-calendar detail-icon"></i>
                <div class="detail-text">
                    Sábado, 7 de Noviembre - 9:00 AM
                </div>
            </div>
            
            <div class="detail-item">
                <i class="fa-solid fa-location-dot detail-icon"></i>
                <div class="detail-text">
                    Parque Metropolitano, Guadalajara<br>
                    <a href="#" class="link-map">Ver en mapa</a>
                </div>
            </div>
            
            <div class="detail-item">
                <i class="fa-regular fa-user detail-icon"></i>
                <div class="detail-text">
                    Organizado por Sofia M. (<i class="fa-solid fa-star rating-star"></i> 4.9)
                </div>
            </div>
        </div>

        <!-- Asistentes -->
        <div class="attendees-section">
            <h2 class="section-subtitle">Quiénes asisten</h2>
            <div class="attendees-row">
                <div class="avatars-container">
                    <div class="avatar-placeholder">IMG</div>
                    <div class="avatar-placeholder">IMG</div>
                    <div class="avatar-placeholder">IMG</div>
                    <div class="avatar-placeholder">IMG</div>
                </div>
                <div class="attendees-text">
                    +24 personas<br>asistirán
                </div>
            </div>
        </div>

        <!-- Botones Inferiores -->
        <div class="button-group">
            <a href="#" class="btn btn-primary">Unirme al evento</a>
            <a href="#" class="btn btn-secondary">Chat del Grupo (Abierto)</a>
        </div>
    </div>
</div>

</body>
</html>
