<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VToConnect-Web -- Welcome</title>
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/login.css">
</head>
<body>

    <div class="mobile-screen">
        
        <!-- Header / Logo -->
        <div class="header">
            <div class="logo-placeholder"></div>
            <h1>VToConnect</h1>
        </div>

        <!-- Textos de Bienvenida -->
        <div class="welcome-section">
            <h2 id="formTitle">Bienvenido</h2>
            <p id="formSubtitle">Inicia sesión para ver que<br>aventuras nos deparan hoy</p>
        </div>

        <!-- Formulario -->
        <form class="login-form" id="loginForm">
            <!-- Campo extra solo visible en modo Crear Cuenta -->
            <div class="input-group" id="nameGroup" style="display: none;">
                <label for="fullName">Nombre Completo</label>
                <div class="input-wrapper">
                    <input type="text" id="fullName" placeholder="Ej. Ana García">
                </div>
            </div>

            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="tu@email.com">
                </div>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="Ingresa tu Contraseña" style="padding-right: 48px;">
                    <div class="icon-placeholder" id="togglePassword" style="cursor: pointer;"></div>
                </div>
            </div>

            <div class="forgot-password" id="forgotWrapper">
                <a href="#">Contraseña olvidada?</a>
            </div>

            <!-- Mensaje de error -->
            <p id="error-message" style="color: #D95D39; font-size: 14px; text-align: center; margin-bottom: 10px; display: none;"></p>

            <button type="button" class="login-btn" id="loginBtn">Iniciar Sesión</button>
        </form>

        <div class="signup-prompt">
            <span id="promptText">Nuevo en VToConnect?</span> <a href="#" id="toggleModeLink">Crear cuenta</a>
        </div>

        <!-- Footer -->
        <div class="footer">
            <span>© 2026 VToConnect</span>
            <a href="#">Privacidad</a>
            <a href="#">Necesitas Ayuda?</a>
        </div>

    </div>

    <script src="../../supabase/api.js"></script>

    <script>
        const loginBtn = document.getElementById('loginBtn');
        const fullNameInput = document.getElementById('fullName');
        const nameGroup = document.getElementById('nameGroup');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMsg = document.getElementById('error-message');
        const togglePassword = document.getElementById('togglePassword');
        const toggleModeLink = document.getElementById('toggleModeLink');
        const formTitle = document.getElementById('formTitle');
        const formSubtitle = document.getElementById('formSubtitle');
        const forgotWrapper = document.getElementById('forgotWrapper');
        const promptText = document.getElementById('promptText');

        let modoRegistro = false;

        // Alternar entre Iniciar Sesión y Crear Cuenta
        toggleModeLink.addEventListener('click', (e) => {
            e.preventDefault();
            modoRegistro = !modoRegistro;
            errorMsg.style.display = 'none';

            if (modoRegistro) {
                formTitle.textContent = 'Crear Cuenta';
                formSubtitle.innerHTML = 'Únete a la comunidad y<br>descubre nuevos eventos';
                nameGroup.style.display = 'block';
                forgotWrapper.style.display = 'none';
                loginBtn.textContent = 'Registrarme';
                promptText.textContent = '¿Ya tienes cuenta?';
                toggleModeLink.textContent = 'Iniciar sesión';
            } else {
                formTitle.textContent = 'Bienvenido';
                formSubtitle.innerHTML = 'Inicia sesión para ver que<br>aventuras nos deparan hoy';
                nameGroup.style.display = 'none';
                forgotWrapper.style.display = 'block';
                loginBtn.textContent = 'Iniciar Sesión';
                promptText.textContent = 'Nuevo en VToConnect?';
                toggleModeLink.textContent = 'Crear cuenta';
            }
        });

        // Mostrar/ocultar contraseña
        togglePassword.addEventListener('click', () => {
            const esPassword = passwordInput.type === 'password';
            passwordInput.type = esPassword ? 'text' : 'password';
        });

        async function procesarFormulario() {
            const fullName = fullNameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            errorMsg.style.display = 'none';

            if (modoRegistro && !fullName) {
                mostrarError('Por favor ingresa tu nombre completo.');
                return;
            }
            if (!email || !password) {
                mostrarError('Por favor ingresa tu correo y contraseña.');
                return;
            }

            try {
                loginBtn.disabled = true;
                loginBtn.textContent = modoRegistro ? 'Creando cuenta...' : 'Verificando...';

                const usuario = modoRegistro
                    ? await registrarUsuarioAPI(fullName, email, password)
                    : await iniciarSesionAPI(email, password);

                localStorage.setItem('usuario', JSON.stringify(usuario));
                window.location.href = '../explorar/menuExplorar.html';

            } catch (error) {
                mostrarError(error.message || 'Ocurrió un error al procesar tus datos.');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = modoRegistro ? 'Registrarme' : 'Iniciar Sesión';
            }
        }

        function mostrarError(texto) {
            errorMsg.textContent = texto;
            errorMsg.style.display = 'block';
        }

        loginBtn.addEventListener('click', procesarFormulario);
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') procesarFormulario();
        });
    </script>

</body>
</html>
