<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VToConnect-Web - Mis Eventos</title>
    <!-- Font Awesome para los iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../components/navbar/navbar.css">
    <link rel="stylesheet" href="../../styles/mis-eventos.css">
</head>

<body>

    <div class="mobile-app">
        <!-- Cabecera -->
        <header class="header">
            <h1>Mis Eventos</h1>
        </header>

        <!-- Pestañas Interactivas -->
        <div class="tabs-container">
            <div class="tabs">
                <button class="tab-btn active" id="btn-proximos" onclick="switchTab('proximos')">Próximos</button>
                <button class="tab-btn" id="btn-historial" onclick="switchTab('historial')">Historial</button>
            </div>
        </div>

        <!-- Área de Contenido -->
        <div class="content-area">
            
            <!-- Vista: Próximos Eventos -->
            <div id="view-proximos" class="view active-view">
                <div class="empty-state">
                    <p>Cargando tus próximos eventos...</p>
                </div>
            </div>

            <!-- Vista: Historial -->
            <div id="view-historial" class="view">
                <div class="empty-state">
                    <i class="fa-solid fa-folder-open"></i>
                    <p>Aún no tienes eventos pasados.</p>
                </div>
            </div>

        </div>

        <!-- Barra de navegación inferior -->
        <nav class="bottom-nav">
            <a href="../explorar/menuExplorar.html" class="nav-item">
                <i class="fa-regular fa-compass"></i>
                <span>Explorar</span>
            </a>
            <a href="../mis-eventos/misEventos.html" class="nav-item active">
                <i class="fa-regular fa-calendar-check"></i>
                <span>Mis Eventos</span>
            </a>
            <a href="../crear-evento/crearEvento.html" class="nav-item">
                <i class="fa-solid fa-circle-plus"></i>
                <span>Crear</span>
            </a>
            <a href="../chat/menuChat.html" class="nav-item">
                <i class="fa-regular fa-comment-dots"></i>
                <span>Mensajes</span>
            </a>
            <a href="../perfil/menuPerfil.html" class="nav-item">
                <i class="fa-regular fa-user"></i>
                <span>Perfil</span>
            </a>
        </nav>
    </div>

    <script src="../../supabase/api.js"></script>
    <script>
        function switchTab(tabName) {
            const btnProximos = document.getElementById('btn-proximos');
            const btnHistorial = document.getElementById('btn-historial');
            const viewProximos = document.getElementById('view-proximos');
            const viewHistorial = document.getElementById('view-historial');

            btnProximos.classList.remove('active');
            btnHistorial.classList.remove('active');
            viewProximos.classList.remove('active-view');
            viewHistorial.classList.remove('active-view');

            if (tabName === 'proximos') {
                btnProximos.classList.add('active');
                viewProximos.classList.add('active-view');
            } else if (tabName === 'historial') {
                btnHistorial.classList.add('active');
                viewHistorial.classList.add('active-view');
            }
        }

        function formatearFecha(isoString) {
            if (!isoString) return 'Fecha por confirmar';
            const fecha = new Date(isoString);
            const opcionesDia = { weekday: 'long', day: 'numeric', month: 'short' };
            const opcionesHora = { hour: '2-digit', minute: '2-digit', hour12: true };
            const diaTexto = fecha.toLocaleDateString('es-MX', opcionesDia);
            const horaTexto = fecha.toLocaleTimeString('es-MX', opcionesHora);
            return `${diaTexto.charAt(0).toUpperCase() + diaTexto.slice(1)}, ${horaTexto}`;
        }

        function renderizarTarjetaEvento(ev, esPasado) {
            const asistentes = Array.isArray(ev.event_attendees) ? ev.event_attendees : [];
            const avataresHTML = asistentes.slice(0, 4).map(a => {
                const avatar = a.users?.avatar_url;
                return avatar
                    ? `<img src="${avatar}" alt="${a.users?.full_name || ''}" class="attendee-pic" style="object-fit: cover;">`
                    : `<div class="attendee-pic"></div>`;
            }).join('');

            const footerAsistentes = asistentes.length > 0
                ? `<div class="card-footer-info">
                        <div class="attendees">${avataresHTML}</div>
                        <div class="chat-status">
                            ${ev.is_chat_open ? 'Chat activo <i class="fa-regular fa-comment-dots"></i>' : 'Chat cerrado'}
                        </div>
                   </div>`
                : `<div style="height: 15px;"></div>`;

            let botonHTML = '';
            if (esPasado) {
                botonHTML = `
                    <button class="card-btn btn-disabled-chat" onclick="window.location.href='../filtros/detalleEventos.html?id=${ev.id}'">
                        <div>Ver Detalles</div>
                        <span>Evento finalizado</span>
                    </button>`;
            } else if (ev.is_chat_open) {
                botonHTML = `
                    <button class="card-btn btn-active-chat" onclick="window.location.href='../chat/menuChat.html?eventId=${ev.id}'">
                        <div><i class="fa-solid fa-comment-dots"></i> Chat del Evento</div>
                    </button>`;
            } else {
                botonHTML = `
                    <button class="card-btn btn-disabled-chat" disabled>
                        <div>Chat del Evento</div>
                        <span>Disponible próximamente</span>
                    </button>`;
            }

            return `
                <div class="event-card">
                    <h2 class="event-title" onclick="window.location.href='../filtros/detalleEventos.html?id=${ev.id}'" style="cursor:pointer;">
                        ${ev.title}
                    </h2>
                    <div class="event-detail">
                        <i class="fa-regular fa-calendar"></i>
                        <span>${formatearFecha(ev.starts_at)}</span>
                    </div>
                    <div class="event-detail">
                        <i class="fa-solid fa-location-dot"></i>
                        <span>${ev.location_name}</span>
                    </div>
                    ${footerAsistentes}
                    ${botonHTML}
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const usuario = JSON.parse(localStorage.getItem('usuario'));
            if (!usuario) {
                window.location.href = '../login/menuLogin.html';
                return;
            }

            const viewProximos = document.getElementById('view-proximos');
            const viewHistorial = document.getElementById('view-historial');

            try {
                const misEventos = await obtenerMisEventosAPI(usuario.id);
                const ahora = new Date();

                const proximos = misEventos.filter(ev => new Date(ev.starts_at) >= ahora);
                const pasados = misEventos.filter(ev => new Date(ev.starts_at) < ahora);

                if (proximos.length > 0) {
                    viewProximos.innerHTML = proximos.map(ev => renderizarTarjetaEvento(ev, false)).join('');
                } else {
                    viewProximos.innerHTML = `
                        <div class="empty-state">
                            <i class="fa-regular fa-calendar-xmark"></i>
                            <p>No tienes eventos próximos.<br>¡Explora o crea uno nuevo!</p>
                        </div>`;
                }

                if (pasados.length > 0) {
                    viewHistorial.innerHTML = pasados.map(ev => renderizarTarjetaEvento(ev, true)).join('');
                } else {
                    viewHistorial.innerHTML = `
                        <div class="empty-state">
                            <i class="fa-solid fa-folder-open"></i>
                            <p>Aún no tienes eventos pasados.</p>
                        </div>`;
                }
            } catch (error) {
                console.error('Error al cargar Mis Eventos:', error);
                viewProximos.innerHTML = `
                    <div class="empty-state">
                        <p>Error al cargar tus eventos. Intenta recargar la página.</p>
                    </div>`;
            }
        });
    </script>
</body>
</html>
